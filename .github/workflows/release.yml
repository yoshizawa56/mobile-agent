name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            echo "Expected a tag such as v0.0.1 or v0.0.1-beta.1" >&2
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit public repository contents
        run: bun run audit:public

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build packages
        run: bun run build

  build-agent:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: bun-linux-x64
          - name: linux-arm64
            target: bun-linux-arm64
          - name: darwin-arm64
            target: bun-darwin-arm64
          - name: darwin-x64
            target: bun-darwin-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      - name: Build standalone agent executable
        env:
          TARGET: ${{ matrix.target }}
          OUTPUT: dist/agent-${{ matrix.name }}
        run: |
          mkdir -p dist
          bun build \
            --compile \
            --minify \
            --target="$TARGET" \
            apps/agent-cli/src/index.ts \
            --outfile="$OUTPUT"
          chmod +x "$OUTPUT"
          test -s "$OUTPUT"
          file "$OUTPUT"

      - name: Upload standalone agent executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-agent-${{ matrix.name }}
          path: dist/agent-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build-agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-agent-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          sha256sum \
            dist/agent-linux-x64 \
            dist/agent-linux-arm64 \
            dist/agent-darwin-arm64 \
            dist/agent-darwin-x64 \
            > dist/SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "$RELEASE_TAG"
          )

          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload \
              "$RELEASE_TAG" \
              dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create \
              "$RELEASE_TAG" \
              dist/* \
              "${release_args[@]}"
          fi
