[tools]
bun = "1.3.14"
node = "24.19.0"
tmux = "3.7b"

[tasks.install]
description = "Install the locked workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Start the local agentd and web development stack with child-process cleanup"
run = "bun dev"

[tasks.dev-serve]
description = "Expose an already-running web dev server through an existing Tailscale CLI"
run = "bun scripts/dev-serve.mjs"

[tasks.check]
description = "Run the public-repository audit and project checks"
run = "bun run audit:public && bun run typecheck && bun run test && bun run build"
