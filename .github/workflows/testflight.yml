name: TestFlight

on:
  workflow_dispatch:

run-name: TestFlight / ${{ github.ref_name }} / ${{ github.sha }}

permissions:
  contents: read

concurrency:
  group: testflight-app-store-connect-upload
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record source revision
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' '## TestFlight build'
            printf '%s\n' "- Ref: \`$GITHUB_REF\`"
            printf '%s\n' "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run repository checks
        uses: ./.github/actions/repository-checks

  build-ios:
    name: Build and upload iOS app
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and upload iOS app
        uses: ./.github/actions/ios-release
        with:
          asc_api_key_id: ${{ secrets.IOS_ASC_API_KEY_ID }}
          asc_issuer_id: ${{ secrets.IOS_ASC_ISSUER_ID }}
          asc_api_private_key: ${{ secrets.IOS_ASC_API_PRIVATE_KEY }}
          dist_certificate_base64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          dist_certificate_password: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          app_store_profile_base64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
