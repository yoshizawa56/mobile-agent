name: Repository checks
description: Run the repository audit, typecheck, tests, and package build.

runs:
  using: composite
  steps:
    - name: Verify checked out commit
      shell: bash
      run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Audit public repository contents
      shell: bash
      run: bun run audit:public

    - name: Typecheck
      shell: bash
      run: bun run typecheck

    - name: Test
      shell: bash
      run: bun run test

    - name: Build packages
      shell: bash
      run: bun run build
